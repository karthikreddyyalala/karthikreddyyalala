name: Refresh profile cards

# Re-scrapes the public contribution calendar and re-renders the SVG cards.
"on":
  schedule:
    - cron: "23 7 * * *" # daily, about 00:23 in Arizona
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/render.py --test
      - run: python3 scripts/render.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
